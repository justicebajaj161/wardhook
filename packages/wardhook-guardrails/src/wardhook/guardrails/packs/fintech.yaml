# Fintech entity pack.
#
# Extends `default` with banking and payments identifiers. Account-shaped
# numbers are validated by checksum wherever a standard defines one (IBAN,
# card), because pattern shape alone is a poor discriminator in financial text
# that is already dense with numbers.

name: fintech
extends: default
description: Banking, payments, and crypto identifiers.

rules:
  - entity: IBAN
    pattern: '\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b'
    severity: critical
    validator: iban
    description: International Bank Account Number, confirmed by its mod-97 checksum.

  - entity: SWIFT_BIC
    pattern: '\b[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?\b'
    severity: high
    context_words: ['swift', 'bic', 'bank code', 'wire', 'transfer']
    description: SWIFT/BIC code, required to appear near a transfer term.

  - entity: US_ROUTING_NUMBER
    pattern: '\b[0-9]{9}\b'
    severity: critical
    context_words: ['routing', 'aba', 'ach', 'wire']
    description: US bank routing number, required to appear near a routing term.

  - entity: UK_SORT_CODE
    pattern: '\b\d{2}-\d{2}-\d{2}\b'
    severity: high
    description: UK sort code.

  - entity: BANK_ACCOUNT
    pattern: '\b\d{8,17}\b'
    severity: critical
    context_words: ['account number', 'acct', 'account no', 'a/c']
    description: Bank account number, required to appear near an account term.

  - entity: CRYPTO_WALLET
    pattern: '\b(?:bc1[a-z0-9]{25,62}|[13][a-km-zA-HJ-NP-Z1-9]{25,34}|0x[a-fA-F0-9]{40})\b'
    severity: critical
    description: Bitcoin or Ethereum wallet address.

  - entity: TAX_ID_EIN
    pattern: '\b\d{2}-\d{7}\b'
    severity: high
    description: US Employer Identification Number.

  - entity: CVV
    pattern: '\b\d{3,4}\b'
    severity: critical
    context_words: ['cvv', 'cvc', 'security code', 'card verification']
    description: Card security code, required to appear near a CVV term.
