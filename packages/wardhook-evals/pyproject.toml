[build-system]
# Upper-bounded deliberately. hatchling 1.30.0 and 1.32.0 emit
# `Metadata-Version: 2.5`, which `packaging` (and therefore `twine check` and
# `twine upload`) reject as invalid -- a wheel built with them cannot be
# published. Raise the bound once the packaging toolchain accepts 2.5.
requires = ["hatchling>=1.27,!=1.30.*,<1.32"]
build-backend = "hatchling.build"

[project]
name = "wardhook-evals"
version = "0.1.1"
description = "JSONL test cases, a pass/fail runner, and baseline regression detection for LLM agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Aditya Gupta", email = "adityabajaj161@gmail.com" }]
maintainers = [{ name = "Aditya Gupta", email = "adityabajaj161@gmail.com" }]
keywords = ["evals", "evaluation", "testing", "regression", "llm", "agent", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Zero runtime dependencies beyond the CLI framework: the runner targets any
# object with an `.invoke()` method, so it never needs to know what it is
# testing or which framework built it.
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
# The `llm_judge` criterion needs a model; everything else is pure stdlib.
judge = ["langchain-core>=1.4,<2"]

[project.scripts]
wardhook-eval = "wardhook.evals.cli:main"

[project.urls]
Homepage = "https://github.com/justicebajaj161/wardhook"
Documentation = "https://github.com/justicebajaj161/wardhook/blob/main/docs/packages/evals.md"
Repository = "https://github.com/justicebajaj161/wardhook"
Issues = "https://github.com/justicebajaj161/wardhook/issues"
Changelog = "https://github.com/justicebajaj161/wardhook/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/wardhook"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE"]
