name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen || uv sync
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: Validate the workflows themselves
        # An unterminated quote in a `run:` block is valid YAML and a broken
        # shell script. Without this it costs a CI run to find out.
        run: uv run ./scripts/check-workflows.sh

  types:
    name: Type-check ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - wardhook-core
          - wardhook-guardrails
          - wardhook-observability
          - wardhook-evals
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen || uv sync
      - run: uv run mypy packages/${{ matrix.package }}/src

  test:
    # The load-bearing job. Each package is installed into an environment
    # containing NO other Wardhook package, then its own suite runs there. If a
    # package ever reaches for a sibling, this fails -- which is what makes
    # "each package works standalone" a checked property and not a claim.
    name: ${{ matrix.package }} alone on py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - wardhook-core
          - wardhook-guardrails
          - wardhook-observability
          - wardhook-evals
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install only this package
        run: |
          uv venv --python ${{ matrix.python }} .venv-solo
          VIRTUAL_ENV=.venv-solo uv pip install -e packages/${{ matrix.package }} pytest pytest-cov httpx
      - name: Confirm no sibling package leaked in
        run: |
          .venv-solo/bin/python - <<'PY'
          import sys
          here = "${{ matrix.package }}".replace("wardhook-", "")
          siblings = {"core", "guardrails", "observability", "evals"} - {here}
          leaked = []
          for name in sorted(siblings):
              try:
                  __import__(f"wardhook.{name}")
                  leaked.append(name)
              except ModuleNotFoundError:
                  pass
          if leaked:
              sys.exit(f"FAIL: wardhook.{{{','.join(leaked)}}} importable in a solo install")
          print(f"OK: wardhook.{here} is installed alone")
          PY
      - name: Run this package's suite
        run: |
          .venv-solo/bin/python -m pytest packages/${{ matrix.package }}/tests \
            -q -p no:cacheprovider --import-mode=importlib -c /dev/null

  integration:
    name: All four together
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen || uv sync
      - name: Full suite, including doctests, with the coverage gate
        # fail_under = 100 in pyproject.toml. A drop fails the build here
        # rather than being noticed when someone reads the README's table.
        run: uv run pytest -q --cov --cov-report=term-missing
      - name: Runnable examples
        run: |
          for script in examples/*.py; do
            [ -f "$script" ] || continue
            grep -q "wardhook-ci: skip" "$script" && { echo "skip (not written yet): $script"; continue; }
            echo "==> $script"
            uv run python "$script"
          done

  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen || uv sync
      - name: Build all five
        run: |
          for package in wardhook-core wardhook-guardrails wardhook-observability \
                         wardhook-evals wardhook; do
            uv run python -m build --outdir dist "packages/$package"
          done
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  meta:
    # The `wardhook` meta-package ships no code, so nothing above exercises it.
    # This is the only job that proves its one job: that installing it alone
    # brings in all four packages, at versions that agree.
    name: pip install wardhook
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Install only the meta-package
        run: |
          uv venv --python 3.12 .venv-meta
          VIRTUAL_ENV=.venv-meta uv pip install --find-links dist wardhook
      - name: All four must be present, at one version
        run: |
          .venv-meta/bin/python - <<'PY'
          from importlib.metadata import version
          import wardhook.core, wardhook.guardrails, wardhook.observability, wardhook.evals

          names = [
              "wardhook",
              "wardhook-core",
              "wardhook-guardrails",
              "wardhook-observability",
              "wardhook-evals",
          ]
          seen = {name: version(name) for name in names}
          assert len(set(seen.values())) == 1, f"versions out of lockstep: {seen}"
          print(f"pip install wardhook -> all five at {seen['wardhook']}")
          PY
      - name: The console scripts must be on PATH
        run: |
          for script in wardhook wardhook-trace wardhook-eval; do
            test -x ".venv-meta/bin/$script" || { echo "::error::$script missing"; exit 1; }
          done
          echo "wardhook, wardhook-trace and wardhook-eval all present"
