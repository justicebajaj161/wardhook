name: Extension

# The VS Code extension is TypeScript and has nothing to do with the four
# Python packages, so it gets its own workflow rather than a matrix entry in
# ci.yml. Path filters keep it off Python-only changes and vice versa.
on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: extension

jobs:
  build:
    name: Type-check, lint, and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck
      - name: eslint
        run: npm run lint
      - name: esbuild
        run: npm run package

  sidecar:
    name: Lint the analyzer against the repo's Python gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.7"
          enable-cache: true
      - run: uv sync --frozen || uv sync
      - name: The sidecar obeys the same ruff rules as the packages
        run: |
          uv run ruff check extension/
          uv run ruff format --check extension/

  test:
    name: Integration tests in a real VS Code
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The analyzer needs the guardrails package importable
        run: pip install ./packages/wardhook-guardrails
        working-directory: .
      - run: npm ci
      - run: npm run pretest
      - name: Run the suite under xvfb
        run: xvfb-run -a npm test

  package:
    name: Build the .vsix
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run package
      - name: vsce package
        run: npx --yes @vscode/vsce package --no-dependencies --out wardhook-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: wardhook-vscode-vsix
          path: extension/wardhook-vscode.vsix
          if-no-files-found: error
